<VirtualHost *:80>
    ServerName netpanzer.outiva.com
    Redirect permanent / https://netpanzer.outiva.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName netpanzer.outiva.com

    SSLEngine on
    SSLCertificateFile /etc/ssl/netpanzer.outiva.com/origin.crt
    SSLCertificateKeyFile /etc/ssl/netpanzer.outiva.com/origin.key

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # This route must precede the catch-all HTTP proxy. `nocanon` preserves the
    # selected server query string used by the gateway allowlist.
    ProxyPass        /game ws://127.0.0.1:8080/game nocanon retry=0 timeout=3600
    ProxyPassReverse /game ws://127.0.0.1:8080/game

    ProxyPass        / http://127.0.0.1:8080/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8080/

    AddType application/wasm .wasm

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/netpanzer.outiva.com-error.log
    CustomLog ${APACHE_LOG_DIR}/netpanzer.outiva.com-access.log combined
</VirtualHost>
